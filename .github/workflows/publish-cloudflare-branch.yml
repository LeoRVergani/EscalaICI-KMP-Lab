name: Publish Cloudflare branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Web
        run: ./scripts/build-web.sh

      - name: Validate static site
        run: |
          test -f cloudflare-dist/index.html
          test -f cloudflare-dist/composeApp.js
          find cloudflare-dist -type f -name '*.wasm' -print -quit | grep -q .

      - name: Publish orphan branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R cloudflare-dist/. "$publish_dir/"
          {
            echo "Source commit: $SOURCE_COMMIT"
            echo "Build date UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Web mode: WEB_WASM"
          } > "$publish_dir/BUILD_INFO.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan cloudflare-pages
          git rm -rf .
          cp -R "$publish_dir"/. .
          git add --all
          git commit -m "Publish Web from $SOURCE_COMMIT"
          git push --force origin cloudflare-pages
