name: Publish Cloudflare branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Firebase
        shell: bash
        env:
          FIREBASE_PROPERTIES: ${{ secrets.FIREBASE_PROPERTIES }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_PROPERTIES" ]; then
            echo "FIREBASE_PROPERTIES não configurado no GitHub Actions."
            exit 1
          fi

          printf '%s\n' "$FIREBASE_PROPERTIES" > local.firebase.properties
          echo "Firebase config preparado para o build."

      - name: Build and test Web
        run: ./scripts/build-web.sh

      - name: Validate static site
        run: |
          test -f cloudflare-dist/index.html
          test -f cloudflare-dist/composeApp.js
          find cloudflare-dist -type f -name '*.wasm' -print -quit | grep -q .

      - name: Publish orphan branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          cp -a cloudflare-dist/. "$publish_dir/"
          {
            echo "Source commit: $SOURCE_COMMIT"
            echo "Build date UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Web mode: WEB_WASM"
          } > "$publish_dir/BUILD_INFO.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan cloudflare-pages

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -a "$publish_dir/." .
          touch .nojekyll

          git add -A
          git commit -m "Publish Web from $SOURCE_COMMIT"
          git push --force origin HEAD:cloudflare-pages
