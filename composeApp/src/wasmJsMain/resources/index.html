<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#070B12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escala ICI">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Escala ICI</title>
  <style>
    :root {
      --app-viewport-height: 100vh;
      --app-safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: var(--app-viewport-height);
      max-height: var(--app-viewport-height);
      background: #070B12;
      overscroll-behavior: none;
      overflow: hidden;
    }
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;
      }
    }
    #webApp {
      box-sizing: border-box;
      display: block;
      width: 100%;
      height: var(--app-viewport-height);
      max-height: var(--app-viewport-height);
      padding-bottom: var(--app-safe-area-bottom);
      overflow: hidden;
    }
    @supports (height: 100dvh) {
      #webApp {
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;
      }
    }
    #webApp > canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="webApp"></div>
  <script>
    (() => {
      if (CSS.supports("height", "100dvh")) return;

      let viewportUpdateFrame = 0;

      const updateViewportHeight = () => {
        viewportUpdateFrame = 0;
        const visualViewportHeight = window.visualViewport?.height;
        const validCandidates = [visualViewportHeight, window.innerHeight]
          .filter((height) => Number.isFinite(height) && height > 0);
        const viewportWidth = window.visualViewport?.width || window.innerWidth;
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        const viewportHeight = validCandidates.find((height) =>
          isPortrait ? height >= viewportWidth : height <= viewportWidth
        ) || validCandidates[0];
        if (viewportHeight === undefined) return;

        document.documentElement.style.setProperty("--app-viewport-height", `${viewportHeight}px`);
      };

      const scheduleViewportUpdate = (waitForNextFrame = false) => {
        if (viewportUpdateFrame) return;
        viewportUpdateFrame = window.requestAnimationFrame(() => {
          if (waitForNextFrame) {
            viewportUpdateFrame = window.requestAnimationFrame(updateViewportHeight);
          } else {
            updateViewportHeight();
          }
        });
      };

      scheduleViewportUpdate();
      window.addEventListener("load", () => scheduleViewportUpdate());
      window.addEventListener("resize", () => scheduleViewportUpdate());
      window.addEventListener("orientationchange", () => {
        document.documentElement.style.removeProperty("--app-viewport-height");
        scheduleViewportUpdate(true);
      });
      window.addEventListener("pageshow", () => scheduleViewportUpdate());
      document.addEventListener("visibilitychange", () => scheduleViewportUpdate());
      window.visualViewport?.addEventListener("resize", () => scheduleViewportUpdate());
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="workbook-import.js"></script>
  <script src="remote-download.js"></script>
  <script src="dropbox-auth.js"></script>
  <script src="msal-browser.min.js"></script>
  <script src="msal-browser-interop.js"></script>
  <script src="composeApp.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
