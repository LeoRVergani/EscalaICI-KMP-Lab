<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#101418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escala ICI">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Escala ICI</title>
  <style>
    :root {
      --app-viewport-height: 100vh;
      --app-safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }
    @supports (height: 100dvh) {
      :root {
        --app-viewport-height: 100dvh;
      }
    }
    html, body {
      margin: 0;
      width: 100%;
      height: var(--app-viewport-height);
      max-height: var(--app-viewport-height);
      background: #101418;
      overscroll-behavior: none;
      overflow: hidden;
    }
    #webApp {
      box-sizing: border-box;
      display: block;
      width: 100%;
      height: var(--app-viewport-height);
      max-height: var(--app-viewport-height);
      padding-bottom: var(--app-safe-area-bottom);
      overflow: hidden;
    }
    #webApp > canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="webApp"></div>
  <script>
    (() => {
      let viewportUpdateFrame = 0;

      const updateViewportHeight = () => {
        viewportUpdateFrame = 0;
        const viewportHeight = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty("--app-viewport-height", `${viewportHeight}px`);
      };

      const scheduleViewportUpdate = () => {
        if (viewportUpdateFrame) return;
        viewportUpdateFrame = window.requestAnimationFrame(updateViewportHeight);
      };

      scheduleViewportUpdate();
      window.addEventListener("load", scheduleViewportUpdate);
      window.addEventListener("resize", scheduleViewportUpdate);
      window.addEventListener("orientationchange", scheduleViewportUpdate);
      window.addEventListener("pageshow", scheduleViewportUpdate);
      document.addEventListener("visibilitychange", scheduleViewportUpdate);
      window.visualViewport?.addEventListener("resize", scheduleViewportUpdate);
      window.visualViewport?.addEventListener("scroll", scheduleViewportUpdate);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="workbook-import.js"></script>
  <script src="remote-download.js"></script>
  <script src="dropbox-auth.js"></script>
  <script src="composeApp.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
